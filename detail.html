<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายละเอียด - DramaBox</title>
    <meta name="description" content="รายละเอียดซีรีส์">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <div class="logo-icon">🎬</div>
                <span class="logo-text">DramaBox</span>
            </a>
            
            <div class="nav-links">
                <a href="index.html" class="nav-link" data-i18n="nav.home">หน้าแรก</a>
                <a href="search.html" class="nav-link">ค้นหา</a>
            </div>
            
            <select class="lang-select" id="lang-select">
                <option value="th">🇹🇭 ไทย</option>
                <option value="en">🇺🇸 English</option>
            </select>
        </div>
    </nav>

    <!-- Detail Hero -->
    <section class="detail-hero" id="detail-hero">
        <div class="detail-backdrop" id="detail-backdrop">
            <img src="" alt="" id="backdrop-img">
            <div class="detail-backdrop-overlay"></div>
        </div>
        
        <div class="container">
            <div class="detail-content">
                <div class="detail-poster" id="detail-poster">
                    <img src="" alt="" id="poster-img">
                </div>
                
                <div class="detail-info">
                    <h1 id="drama-title">กำลังโหลด...</h1>
                    
                    <div class="detail-meta" id="drama-meta">
                        <!-- Loaded dynamically -->
                    </div>
                    
                    <div class="detail-tags" id="drama-tags">
                        <!-- Loaded dynamically -->
                    </div>
                    
                    <h3 data-i18n="detail.synopsis">เรื่องย่อ</h3>
                    <p class="detail-synopsis" id="drama-synopsis">...</p>
                    
                    <a href="#" class="btn-watch" id="btn-watch">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                        <span data-i18n="detail.watchNow">รับชมตอนนี้</span>
                    </a>
                </div>
            </div>
        </div>
    </section>

    <!-- Episode List -->
    <section class="episode-section">
        <div class="container">
            <div class="section-header-sm">
                <div class="section-icon-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #8b5cf6"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="17" x2="22" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/></svg>
                </div>
                <div>
                    <h2 class="section-title-sm" data-i18n="detail.episodeList">รายการตอน</h2>
                    <p class="section-subtitle" id="episode-count">0 ตอน</p>
                </div>
            </div>
            
            <div class="episode-grid" id="episode-grid">
                <!-- Loaded dynamically -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">DramaBox</div>
                <p class="footer-text">© 2026 DramaBox. <span data-i18n="footer.rights">สงวนลิขสิทธิ์</span></p>
            </div>
        </div>
    </footer>

    <!-- Mobile Navigation -->
    <nav class="mobile-nav">
        <a href="index.html" class="mobile-nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mobile-nav-icon"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span data-i18n="nav.home">หน้าแรก</span>
        </a>
        <a href="search.html" class="mobile-nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mobile-nav-icon"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <span>ค้นหา</span>
        </a>
    </nav>

    <!-- Scripts -->
    <script src="js/i18n.js"></script>
    <script src="js/api.js"></script>
    <script src="js/components.js"></script>
    <script>
        let dramaData = null;
        let episodesData = [];
        
        document.addEventListener('DOMContentLoaded', async () => {
            i18n.initLanguageSelector();
            i18n.applyTranslations();
            
            const bookId = getUrlParam('id');
            const lang = getCurrentLanguage();
            
            if (!bookId) {
                window.location.href = 'index.html';
                return;
            }
            
            Components.toggleLoading(true);
            
            try {
                // Load drama details and episodes
                const [drama, episodes] = await Promise.all([
                    DramaAPI.getDramaDetail(bookId, lang),
                    DramaAPI.getEpisodes(bookId, lang)
                ]);
                
                dramaData = drama;
                episodesData = episodes || [];
                
                renderDramaDetail(drama);
                renderEpisodes(episodes);
                
                // Update page title
                document.title = `${drama.bookName} - DramaBox`;
                
            } catch (error) {
                console.error('Error loading drama:', error);
                alert(t('common.error'));
            } finally {
                Components.toggleLoading(false);
            }
        });
        
        function renderDramaDetail(drama) {
            const coverUrl = drama.coverWap || drama.cover || '';
            
            // Images
            document.getElementById('backdrop-img').src = coverUrl;
            document.getElementById('poster-img').src = coverUrl;
            document.getElementById('poster-img').alt = drama.bookName;
            
            // Title
            document.getElementById('drama-title').textContent = drama.bookName;
            
            // Meta
            const metaHtml = `
                <span class="detail-meta-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/></svg>
                    ${drama.chapterCount || 0} ${t('detail.episodes')}
                </span>
                ${drama.playCount ? `
                    <span class="detail-meta-item">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        ${formatNumber(drama.playCount)} ${t('detail.views')}
                    </span>
                ` : ''}
                ${drama.protagonist ? `
                    <span class="detail-meta-item">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        ${drama.protagonist}
                    </span>
                ` : ''}
            `;
            document.getElementById('drama-meta').innerHTML = metaHtml;
            
            // Tags
            const tags = drama.tags || drama.tagNames || [];
            document.getElementById('drama-tags').innerHTML = tags
                .map(tag => `<span class="detail-tag">${tag}</span>`)
                .join('');
            
            // Synopsis
            document.getElementById('drama-synopsis').textContent = drama.introduction || drama.description || 'ไม่มีเรื่องย่อ';
            
            // Watch button
            const btnWatch = document.getElementById('btn-watch');
            btnWatch.href = `watch.html?id=${drama.bookId}&ep=0`;
        }
        
        function renderEpisodes(episodes) {
            const grid = document.getElementById('episode-grid');
            const bookId = getUrlParam('id');
            
            if (!episodes || episodes.length === 0) {
                grid.innerHTML = `<p>${t('common.noData')}</p>`;
                return;
            }
            
            // Update count
            document.getElementById('episode-count').textContent = `${episodes.length} ${t('detail.episodes')}`;
            
            grid.innerHTML = episodes.map((ep, index) => `
                <a href="watch.html?id=${bookId}&ep=${index}" class="episode-card">
                    <div class="episode-number">${index + 1}</div>
                    <div class="episode-title">${t('detail.episode')} ${index + 1}</div>
                </a>
            `).join('');
        }
    </script>
</body>
</html>
