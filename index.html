<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DramaBox - สตรีมมิงซีรีส์สั้น</title>
    <meta name="description" content="รับชมซีรีส์สั้นฟรีโดยไม่มีโฆษณา ค้นพบซีรีส์น่าสนใจจากหลากหลายประเภท">
    <meta name="keywords" content="ซีรีส์สั้น, สตรีมมิงซีรีส์, รับชมซีรีส์ฟรี, DramaBox">
    
    <!-- Open Graph -->
    <meta property="og:title" content="DramaBox - สตรีมมิงซีรีส์สั้นฟรี">
    <meta property="og:description" content="ค้นพบและรับชมซีรีส์สั้นโปรดของคุณฟรี!">
    <meta property="og:type" content="website">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <div class="logo-icon">🎬</div>
                <span class="logo-text">DramaBox</span>
            </a>
            
            <div class="nav-links">
                <a href="index.html" class="nav-link active" data-i18n="nav.home">หน้าแรก</a>
                <a href="search.html" class="nav-link" data-i18n="nav.latest">ค้นหา</a>
            </div>
            
            <div class="search-box">
                <span class="search-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </span>
                <input type="text" class="search-input" id="search-input" placeholder="ค้นหาซีรีส์..." data-i18n="nav.search">
            </div>
            
            <select class="lang-select" id="lang-select">
                <option value="th">🇹🇭 ไทย</option>
                <option value="en">🇺🇸 English</option>
            </select>
        </div>
    </nav>

    <!-- Hero Section - For You -->
    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <div class="section-header">
                    <div class="section-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
                    </div>
                    <h1 class="section-title" data-i18n="home.forYou">สำหรับคุณ</h1>
                </div>
                <p class="section-description" data-i18n="home.forYouDesc">ซีรีส์ที่เลือกมาเฉพาะสำหรับคุณ ค้นพบเรื่องราวที่น่าสนใจ!</p>
            </div>
        </div>
    </section>

    <!-- For You Grid -->
    <section class="section">
        <div class="container">
            <div class="drama-grid" id="foryou-grid">
                <!-- Loaded dynamically -->
            </div>
        </div>
    </section>

    <!-- Trending Section -->
    <section class="section section-alt">
        <div class="container">
            <div class="section-header-sm">
                <div class="section-icon-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #f97316"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
                </div>
                <div>
                    <h2 class="section-title-sm" data-i18n="home.trending">กำลังเป็นที่นิยม</h2>
                    <p class="section-subtitle" data-i18n="home.trendingDesc">ซีรีส์ที่ได้รับความนิยมมากที่สุด</p>
                </div>
            </div>
            <div class="drama-grid" id="trending-grid">
                <!-- Loaded dynamically -->
            </div>
        </div>
    </section>

    <!-- Latest Section -->
    <section class="section">
        <div class="container">
            <div class="section-header-sm">
                <div class="section-icon-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #8b5cf6"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </div>
                <div>
                    <h2 class="section-title-sm" data-i18n="home.latest">ล่าสุด</h2>
                    <p class="section-subtitle" data-i18n="home.latestDesc">ซีรีส์ที่เพิ่งเปิดตัวใหม่ อย่าพลาด!</p>
                </div>
            </div>
            <div class="drama-grid" id="latest-grid">
                <!-- Loaded dynamically -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">DramaBox</div>
                <p class="footer-text">© 2026 DramaBox. <span data-i18n="footer.rights">สงวนลิขสิทธิ์</span></p>
                <div class="footer-links">
                    <a href="#" class="footer-link" data-i18n="footer.about">เกี่ยวกับ</a>
                    <a href="#" class="footer-link" data-i18n="footer.privacy">นโยบายความเป็นส่วนตัว</a>
                    <a href="#" class="footer-link" data-i18n="footer.terms">เงื่อนไขการใช้งาน</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Mobile Navigation -->
    <nav class="mobile-nav">
        <a href="index.html" class="mobile-nav-item active">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mobile-nav-icon"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span data-i18n="nav.home">หน้าแรก</span>
        </a>
        <a href="search.html" class="mobile-nav-item">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mobile-nav-icon"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <span>ค้นหา</span>
        </a>
    </nav>

    <!-- Scripts -->
    <script src="js/i18n.js"></script>
    <script src="js/api.js"></script>
    <script src="js/components.js"></script>
    <script>
        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            // Initialize language
            i18n.initLanguageSelector();
            i18n.applyTranslations();
            
            const lang = getCurrentLanguage();
            
            // Show loading
            Components.showLoading('foryou-grid');
            Components.showLoading('trending-grid');
            Components.showLoading('latest-grid');
            
            // Load all sections in parallel
            try {
                const [foryou, trending, latest] = await Promise.all([
                    DramaAPI.getForYouDramas(lang),
                    DramaAPI.getTrendingDramas(lang),
                    DramaAPI.getLatestDramas(lang)
                ]);
                
                Components.renderDramaGrid('foryou-grid', foryou);
                Components.renderDramaGrid('trending-grid', trending);
                Components.renderDramaGrid('latest-grid', latest);
            } catch (error) {
                console.error('Error loading dramas:', error);
                Components.showError('foryou-grid', t('common.error'));
                Components.showError('trending-grid', t('common.error'));
                Components.showError('latest-grid', t('common.error'));
            }
            
            // Search functionality
            const searchInput = document.getElementById('search-input');
            if (searchInput) {
                searchInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' && searchInput.value.trim()) {
                        window.location.href = `search.html?q=${encodeURIComponent(searchInput.value.trim())}`;
                    }
                });
            }
        });
    </script>
</body>
</html>
