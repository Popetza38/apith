<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รับชม - DramaBox</title>
    <meta name="description" content="รับชมซีรีส์">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body { padding-bottom: 0; }
        .watch-container { padding-bottom: 0; }
        @media (max-width: 767px) {
            .mobile-nav { display: none; }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <div class="logo-icon">🎬</div>
                <span class="logo-text">DramaBox</span>
            </a>
            
            <select class="lang-select" id="lang-select">
                <option value="th">🇹🇭 ไทย</option>
                <option value="en">🇺🇸 English</option>
            </select>
        </div>
    </nav>

    <main class="watch-container">
        <!-- Video Player -->
        <div class="video-wrapper">
            <video id="video-player" class="video-player" controls playsinline>
                <source src="" type="video/mp4">
                เบราว์เซอร์ของคุณไม่รองรับการเล่นวิดีโอ
            </video>
        </div>
        
        <!-- Watch Info -->
        <div class="watch-info">
            <div class="container">
                <a href="#" id="drama-link" style="color: var(--text-muted); font-size: 0.9rem;">
                    ← กลับไปหน้ารายละเอียด
                </a>
                <h1 class="watch-title" id="drama-title">กำลังโหลด...</h1>
                <p class="watch-episode" id="current-episode">ตอนที่ 1</p>
                
                <!-- Episode Navigation -->
                <div class="episode-nav">
                    <button class="btn-nav" id="btn-prev" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
                        <span data-i18n="watch.prevEp">ตอนก่อนหน้า</span>
                    </button>
                    
                    <select class="lang-select" id="episode-select" style="flex: 1; max-width: 200px;">
                        <!-- Episodes loaded dynamically -->
                    </select>
                    
                    <button class="btn-nav" id="btn-next">
                        <span data-i18n="watch.nextEp">ตอนถัดไป</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/i18n.js"></script>
    <script src="js/api.js"></script>
    <script src="js/components.js"></script>
    <script>
        let bookId = null;
        let currentEpisode = 0;
        let episodes = [];
        let dramaData = null;
        
        document.addEventListener('DOMContentLoaded', async () => {
            i18n.initLanguageSelector();
            i18n.applyTranslations();
            
            bookId = getUrlParam('id');
            currentEpisode = parseInt(getUrlParam('ep')) || 0;
            const lang = getCurrentLanguage();
            
            if (!bookId) {
                window.location.href = 'index.html';
                return;
            }
            
            Components.toggleLoading(true);
            
            try {
                // Load drama info and episodes
                const [drama, eps] = await Promise.all([
                    DramaAPI.getDramaDetail(bookId, lang),
                    DramaAPI.getEpisodes(bookId, lang)
                ]);
                
                dramaData = drama;
                episodes = eps || [];
                
                // Update UI
                document.getElementById('drama-title').textContent = drama.bookName;
                document.getElementById('drama-link').href = `detail.html?id=${bookId}`;
                document.title = `${drama.bookName} - ตอนที่ ${currentEpisode + 1} - DramaBox`;
                
                // Populate episode selector
                const select = document.getElementById('episode-select');
                select.innerHTML = episodes.map((ep, i) => 
                    `<option value="${i}" ${i === currentEpisode ? 'selected' : ''}>${t('detail.episode')} ${i + 1}</option>`
                ).join('');
                
                // Load video
                await loadVideo(currentEpisode);
                
            } catch (error) {
                console.error('Error:', error);
                alert(t('common.error'));
            } finally {
                Components.toggleLoading(false);
            }
            
            // Event listeners
            document.getElementById('btn-prev').addEventListener('click', () => navigateEpisode(-1));
            document.getElementById('btn-next').addEventListener('click', () => navigateEpisode(1));
            document.getElementById('episode-select').addEventListener('change', (e) => {
                loadVideo(parseInt(e.target.value));
            });
            
            // Auto-play next episode
            document.getElementById('video-player').addEventListener('ended', () => {
                if (currentEpisode < episodes.length - 1) {
                    navigateEpisode(1);
                }
            });
        });
        
        async function loadVideo(episodeIndex) {
            if (episodeIndex < 0 || episodeIndex >= episodes.length) return;
            
            currentEpisode = episodeIndex;
            const lang = getCurrentLanguage();
            
            // Update UI
            document.getElementById('current-episode').textContent = `${t('detail.episode')} ${episodeIndex + 1}`;
            document.getElementById('episode-select').value = episodeIndex;
            
            // Update navigation buttons
            document.getElementById('btn-prev').disabled = episodeIndex === 0;
            document.getElementById('btn-next').disabled = episodeIndex >= episodes.length - 1;
            
            // Update URL without reload
            const url = new URL(window.location);
            url.searchParams.set('ep', episodeIndex);
            window.history.replaceState({}, '', url);
            
            try {
                Components.toggleLoading(true);
                
                // Get video URL from API
                const playerData = await DramaAPI.getVideoPlayer(bookId, episodeIndex, lang);
                
                const videoPlayer = document.getElementById('video-player');
                
                if (playerData && playerData.playUrl) {
                    videoPlayer.src = playerData.playUrl;
                    videoPlayer.load();
                    videoPlayer.play().catch(e => console.log('Autoplay blocked:', e));
                } else {
                    alert('ไม่สามารถโหลดวิดีโอได้');
                }
                
            } catch (error) {
                console.error('Error loading video:', error);
                alert(t('common.error'));
            } finally {
                Components.toggleLoading(false);
            }
        }
        
        function navigateEpisode(direction) {
            const newIndex = currentEpisode + direction;
            if (newIndex >= 0 && newIndex < episodes.length) {
                loadVideo(newIndex);
            }
        }
    </script>
</body>
</html>
